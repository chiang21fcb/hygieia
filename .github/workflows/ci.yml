name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: audit --fail-on high (assert exit code == 1)
        run: |
          set +e
          python scripts/hygieia.py audit fixtures/ecom --fail-on high
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from --fail-on high, got $code" >&2
            exit 1
          fi
      - name: eval (assert demo numbers + dimensions + manifest)
        run: |
          out=$(python scripts/hygieia.py eval fixtures/ecom)
          echo "$out"
          echo "$out" | grep -q "65.0%" && echo "$out" | grep -q "35.0%"
          echo "$out" | grep -q "100.0%" && echo "$out" | grep -q "0.0%"
          echo "$out" | grep -q "entity: control 17/20"
          echo "$out" | grep -q "relation: control 13/20"
          echo "$out" | grep -q "manifest: model simulated"
      - name: rot (assert structural 4 + semantic 2)
        run: |
          out=$(python scripts/hygieia.py rot fixtures/ecom)
          echo "$out"
          echo "$out" | grep -q "New captures: 6 (structural 4 | semantic 2)"
          echo "$out" | grep -q "R8-stale-alias"
          echo "$out" | grep -q "R9-source-freshness"

  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Impact report (informational — never blocks)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            RANGE="HEAD^..HEAD"
          fi
          git diff "$RANGE" | python scripts/hygieia.py impact fixtures/ecom --diff -

  action:
    name: composite action (self-test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # only needed when HYGIEIA_UPLOAD_SARIF=true
    steps:
      - uses: actions/checkout@v4
      - name: Run the composite action (gate disabled so this job proves the plumbing)
        id: hygieia
        uses: ./.github/actions/audit
        with:
          path: fixtures/ecom
          fail-on: none
          upload-sarif: "false"

      - name: Assert the action produced valid JSON + SARIF and real counts
        env:
          HIGH: ${{ steps.hygieia.outputs.findings-high }}
          TOTAL: ${{ steps.hygieia.outputs.findings-total }}
        run: |
          python - <<'PY'
          import json, os
          d = json.load(open("hygieia-audit.json", encoding="utf-8"))
          assert d["summary"]["total"] == 7, d["summary"]
          assert d["summary"]["counts"]["high"] == 3, d["summary"]
          assert os.environ["TOTAL"] == "7", os.environ["TOTAL"]
          assert os.environ["HIGH"] == "3", os.environ["HIGH"]
          s = json.load(open("hygieia.sarif", encoding="utf-8"))
          assert s["version"] == "2.1.0"
          run = s["runs"][0]
          assert run["tool"]["driver"]["name"] == "Hygieia"
          assert len(run["results"]) == 7, len(run["results"])
          assert {r["level"] for r in run["results"]} == {"error", "warning"}
          print("composite action OK: 7 findings, SARIF 2.1.0 with 7 results")
          PY

      - name: Prove the gate exits 1 on high findings
        run: |
          set +e
          hygieia audit fixtures/ecom --fail-on high > /dev/null
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from --fail-on high, got $code" >&2
            exit 1
          fi


  action-sarif:
    name: composite action (SARIF upload, opt-in)
    if: github.event_name == 'push' && vars.HYGIEIA_UPLOAD_SARIF == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/audit
        with:
          path: fixtures/ecom
          fail-on: none
          upload-sarif: "true"
