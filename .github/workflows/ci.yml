name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: audit --fail-on high (assert exit code == 1)
        run: |
          set +e
          python scripts/hygieia.py audit fixtures/ecom --fail-on high
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from --fail-on high, got $code" >&2
            exit 1
          fi
      - name: eval (assert demo numbers)
        run: |
          out=$(python scripts/hygieia.py eval fixtures/ecom)
          echo "$out"
          echo "$out" | grep -q "65.0%" && echo "$out" | grep -q "35.0%"
          echo "$out" | grep -q "100.0%" && echo "$out" | grep -q "0.0%"
      - name: rot (assert 4 new captures)
        run: |
          out=$(python scripts/hygieia.py rot fixtures/ecom)
          echo "$out"
          echo "$out" | grep -q "New captures: 4"

  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Impact report (informational — never blocks)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            RANGE="HEAD^..HEAD"
          fi
          git diff "$RANGE" | python scripts/hygieia.py impact fixtures/ecom --diff -
