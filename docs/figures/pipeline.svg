<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">Hygieia pipeline</title>
  <desc id="d">The ecom fixture (schema, metrics.yml, questions and answers) feeds audit, rot, and eval. audit checks R1-R7, rot re-runs audit on three injected drifts, eval scores two arms against executed gold SQL. report writes reports/health-report.md. adapt dbt and impact are optional read-only v1 utilities.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#6e7781"/>
    </marker>
  </defs>

  <g transform="translate(0,-16)">

  <!-- fixture card -->
  <rect x="40" y="64" width="260" height="236" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="90" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.4" fill="#59636e">ecom fixture</text>

  <rect x="56" y="100" width="228" height="30" rx="7" fill="#f6f8fa" stroke="#e0e4e8"/>
  <text x="70" y="120" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#1f2328">schema.sql</text>

  <rect x="56" y="138" width="228" height="30" rx="7" fill="#f6f8fa" stroke="#e0e4e8"/>
  <text x="70" y="158" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#1f2328">semantic/metrics.yml</text>

  <rect x="56" y="176" width="228" height="44" rx="7" fill="#f6f8fa" stroke="#e0e4e8"/>
  <text x="70" y="194" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#1f2328">questions.yaml</text>
  <text x="70" y="212" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#1f2328">+ demo_results.json</text>

  <line x1="56" y1="240" x2="284" y2="240" stroke="#e0e4e8" stroke-width="1"/>
  <text x="60" y="262" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#59636e">6 tables · 20 questions · 2 arms</text>

  <!-- tool cards -->
  <g>
    <rect x="360" y="64" width="248" height="68" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="372" y="77" width="26" height="26" rx="7" fill="#ddf4ff"/>
    <circle cx="384" cy="89" r="5.2" fill="none" stroke="#0969da" stroke-width="1.8"/><line x1="388.2" y1="93.2" x2="392.6" y2="97.6" stroke="#0969da" stroke-width="1.8" stroke-linecap="round"/>
    <text x="412" y="95" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#0969da">hygieia audit</text>
    <text x="412" y="116" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#59636e">7 rule classes, R1–R7</text>
  </g>

  <g>
    <rect x="360" y="148" width="248" height="68" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="372" y="161" width="26" height="26" rx="7" fill="#ddf4ff"/>
    <path d="M385,167 L391.4,180 L378.6,180 Z" fill="none" stroke="#0969da" stroke-width="1.6" stroke-linejoin="round"/><line x1="385" y1="172" x2="385" y2="175.4" stroke="#0969da" stroke-width="1.6" stroke-linecap="round"/><circle cx="385" cy="177.8" r="0.9" fill="#0969da"/>
    <text x="412" y="179" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#0969da">hygieia rot</text>
    <text x="412" y="200" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#59636e">3 drifts, re-runs audit</text>
  </g>

  <g>
    <rect x="360" y="232" width="248" height="68" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="372" y="245" width="26" height="26" rx="7" fill="#ddf4ff"/>
    <rect x="378" y="259" width="3.4" height="8" rx="1" fill="#0969da"/><rect x="384" y="255" width="3.4" height="12" rx="1" fill="#0969da"/><rect x="390" y="257" width="3.4" height="10" rx="1" fill="#0969da"/>
    <text x="412" y="263" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#0969da">hygieia eval</text>
    <text x="412" y="284" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#59636e">two arms, gold SQL executed</text>
  </g>


  <!-- report card -->
  <rect x="700" y="140" width="220" height="110" rx="12" fill="#0969da" stroke="#0969da"/>
  <rect x="714" y="152" width="24" height="24" rx="6" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="721" y="158" width="10" height="13" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <line x1="723.5" y1="162" x2="728.5" y2="162" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="723.5" y1="165.5" x2="728.5" y2="165.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <text x="750" y="170" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#ffffff">hygieia report</text>
  <text x="714" y="200" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#cae8ff">audit + rot + eval</text>
  <text x="714" y="218" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#cae8ff">3 sections, 1 file</text>

  <rect x="716" y="272" width="188" height="30" rx="7" fill="#ffffff" stroke="#0969da"/>
  <text x="728" y="292" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#1f2328">reports/health-report.md</text>

  <!-- arrows -->
  <g fill="none" stroke="#6e7781" stroke-width="1.6" linejoin="round" marker-end="url(#arrow)">
    <path d="M300,98 H352"/>
    <path d="M300,266 H352"/>
    <path d="M608,98 H740 Q760,98 760,118 V132"/>
    <path d="M608,182 H692"/>
    <path d="M608,266 H648 Q668,266 668,246 V220 Q668,206 700,206"/>
    <path d="M810,250 V266"/>
  </g>

  <!-- v1 utilities -->
  <text x="40" y="355" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#59636e">v1, optional</text>

  <rect x="124" y="336" width="200" height="28" rx="14" fill="none" stroke="#e0e4e8" stroke-dasharray="4 3"/>
  <text x="140" y="355" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#0969da">adapt dbt</text>
  <text x="216" y="355" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#59636e">YAML → metrics.yml</text>

  <rect x="344" y="336" width="224" height="28" rx="14" fill="none" stroke="#e0e4e8" stroke-dasharray="4 3"/>
  <text x="360" y="355" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#0969da">impact</text>
  <text x="410" y="355" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#59636e">git diff → metrics</text>
  </g>
</svg>
