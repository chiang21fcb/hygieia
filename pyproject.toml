[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hygieia-sl"
version = "0.2.0"
description = "Inspect, evaluate, and stress-test your semantic layer — fully offline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "sqlglot>=25.1"]

[project.scripts]
hygieia = "hygieia.engine:main"

[tool.setuptools]
packages = ["hygieia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
